[project]
name = "aurion-ai-signals"
version = "0.1.0"
description = "First runnable version of Aurion AI Signals."
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
aurion-ai-signals = "aurion_ai_signals.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
